---
retention_days: 180

# Date suffix appended to rotated files by dateext. logrotate only accepts
# %Y %m %d %H %M %S %V %s here. Keep it sortable.
logrotate_dateformat: "-%Y-%m-%d"

manage_tomcat_logs: true
manage_nginx_logs: true
manage_journald: true
manage_rsyslog_logs: true

# Adjust this path to the actual Tomcat installation.
tomcat_log_dir: /usr/local/tomcat/logs

# logrotate.service runs inside a systemd sandbox that mounts /usr read-only, so
# rotating a log outside /var fails with "Read-only file system". logrotate's own
# output says nothing — the error surfaces only in the service journal, so the
# rotation can stay silently broken for weeks. A drop-in grants write access back
# for every managed log directory that falls outside /var.
manage_logrotate_sandbox_dropin: true
logrotate_sandbox_paths: "{{ (([tomcat_log_dir] if manage_tomcat_logs else []) + ([nginx_log_dir] if manage_nginx_logs else [])) | reject('match', '/var/') | list }}"

# Adjust this path if the managed host stores Nginx logs elsewhere.
nginx_log_dir: /var/log/nginx
nginx_service_name: nginx.service
nginx_log_user: nginx
nginx_log_group: adm

# 180 days is the maximum age. Journald may remove older entries sooner
# if this size ceiling is reached, so size it for the host's log volume.
journald_system_max_use: 20G

# Start a new journal file at least once a day, matching the one-file-per-day
# policy applied to the text logs.
journald_max_file_sec: 1day

# Must exceed retention_days. Journald's own default is 100, which with
# MaxFileSec=1day would cap real retention at ~100 days regardless of
# MaxRetentionSec.
journald_system_max_files: 200

# Rocky/RHEL commonly places its rsyslog logrotate policy here.
rsyslog_logrotate_file: /etc/logrotate.d/rsyslog
rsyslog_service_name: rsyslog.service
system_text_logs:
  - /var/log/messages
  - /var/log/secure
  - /var/log/maillog
  - /var/log/cron
  - /var/log/spooler
  - /var/log/boot.log
